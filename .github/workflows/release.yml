name: Release APK

on:
  push:
    tags:
      - "v*" # v1.0.0, v1.0.1, ...
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write # required to create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Rebuild the keystore from a base64 secret, plus the properties
      # file that build.gradle.kts reads it through.
      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      # Optional: also produce the .aab if you ever go to Play Store.
      # - run: flutter build appbundle --release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
