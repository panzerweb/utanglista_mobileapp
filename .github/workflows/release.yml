name: Release APK

on:
  push:
    tags:
      - "v*" # v1.0.0, v1.0.1, ...
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write # required to create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Rebuild the keystore from a base64 secret, plus the properties
      # file that build.gradle.kts reads it through.
      #
      # storeFile resolves through rootProject.file(), which is android/,
      # so the path here must be app/upload-keystore.jks — matching the
      # local key.properties.
      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # Fails in seconds if the decode or the path is wrong, instead of
      # seven minutes into the Gradle build.
      - name: Verify keystore
        run: |
          ls -la android/app/upload-keystore.jks
          keytool -list -keystore android/app/upload-keystore.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}"

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
